---
layout: default
---

<article>
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <span class="pub-venue">{{ page.venue }}</span>
      <span class="pub-year">{{ page.year }}</span>
    </div>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>

<a href="{{ '/#publications' | relative_url }}" class="post-back">All publications</a>
